project:
  name: HealthRAG
  language: es
  domain: hipertension_y_salud_cardiovascular

corpus:
  raw_dir: data/raw
  processed_dir: data/processed
  catalog_path: data/processed/corpus_catalog.csv
  metadata_path: data/metadata_template.csv
  chunks_path: data/processed/chunks.jsonl
  allowed_extensions:
    - .pdf
  min_text_chars_per_page: 30

processing:
  chunk_size_tokens: 200
  chunk_overlap_tokens: 60
  # Tokenizer de Hugging Face usado para contar tokens. Si no se puede
  # descargar, se usa un tokenizador por expresiones regulares (fallback).
  tokenizer_name: intfloat/multilingual-e5-small
  # Líneas que aparecen en >= este % de páginas se consideran encabezado/pie.
  # Las guías alternan encabezados en páginas pares e impares: 0.3 los detecta.
  header_footer_min_ratio: 0.3
  min_chunk_chars: 40
  # Secciones sin contenido clínico que se excluyen del índice (regex).
  # Evita que listas bibliográficas o de autores compitan en la búsqueda.
  exclude_sections:
    - "^referencias"
    - "^bibliograf"
    - "lista de colaboradores"
    - "^autoridades"
    - "^equipo elaborador"
    - "^coordinaci[oó]n (general|metodol)"
    - "declaraci[oó]n de (intereses|conflictos)"
    - "^agradecimientos"
    - "^©"
    - "^contenido$"
    - "^[ií]ndice$"

retrieval:
  index_dir: data/index
  embedding_model: intfloat/multilingual-e5-small
  # Prefijos requeridos por la familia E5 (dejar vacíos para otros modelos).
  query_prefix: "query: "
  passage_prefix: "passage: "
  embedding_batch_size: 32
  reranker_model: cross-encoder/mmarco-mMiniLMv2-L12-H384-v1
  # Cantidad de candidatos que aporta cada retriever antes de la fusión.
  candidates_per_retriever: 30
  rrf_k: 60
  # Cantidad de candidatos fusionados que pasan al cross-encoder.
  rerank_candidates: 20
  top_k: 5
  # Si el mejor score del reranker es menor, se considera evidencia débil.
  min_rerank_score: -2.0
  # En modo básico (solo vectorial) umbral de similitud coseno.
  min_vector_score: 0.30

llm:
  # openai_compatible: OpenAI, Groq, Ollama (http://localhost:11434/v1), etc.
  # extractive: proveedor offline determinístico (sin API key), útil para
  #             pruebas, CI y como línea de base sin LLM.
  provider: extractive
  base_url: null              # p.ej. http://localhost:11434/v1 para Ollama
  analyst_model: gpt-4o-mini
  verifier_model: gpt-4o-mini # puede ser un modelo más chico (costo/latencia)
  temperature: 0.0
  max_tokens: 700
  timeout_s: 60
  # Costo estimado USD por 1M tokens (para reportar costo por consulta).
  price_input_per_1m: 0.15
  price_output_per_1m: 0.60

agents:
  # Máximo de ciclos analista -> verificador antes de cerrar.
  max_iterations: 2
  # Fracción mínima de afirmaciones respaldadas para aprobar.
  min_supported_ratio: 0.8
  # Umbral del verificador offline (solapamiento léxico afirmación/cita).
  heuristic_support_threshold: 0.35
  max_context_tokens: 1800

security:
  require_api_key: false      # true en despliegue; claves en HEALTHRAG_API_KEYS
  max_query_chars: 600
  min_query_chars: 5
  block_pii: true
  rate_limit_per_minute: 30
  audit_log: logs/audit.jsonl

cache:
  enabled: true
  max_items: 512
  ttl_seconds: 3600

actions:
  # Acción automática opcional: POST a un webhook (Slack/Discord/genérico)
  # cuando el sistema se abstiene o detecta afirmaciones sin respaldo.
  webhook_enabled: false
  webhook_url_env: HEALTHRAG_WEBHOOK_URL

evaluation:
  queries_path: data/evaluation/queries.csv
  results_dir: reports
  ks: [1, 3, 5, 10]

api:
  host: 0.0.0.0
  port: 8000
  base_url: http://localhost:8000

logging:
  level: INFO
  file: logs/healthrag.log
